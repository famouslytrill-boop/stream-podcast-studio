[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emberbanter-local-studio"
version = "0.6.0"
description = "Private local creator hub, recording controls and verified media exports"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
obs = ["websockets==16.0"]

[project.scripts]
emberbanter = "tools.studio_tools:main"
emberbanter-clips = "tools.clip_tools:main"
emberbanter-hub = "hub.server:main"
emberbanter-mcp = "hub.mcp:main"

[tool.setuptools.packages.find]
include = ["tools", "hub"]

[tool.setuptools.package-data]
hub = ["web/*", "web/brand/*"]
